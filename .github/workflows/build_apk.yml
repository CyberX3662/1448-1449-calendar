name: Build Android APK

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Setup Flutter Stable
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.22.2'
          channel: 'stable'

      - name: Generate Clean Android Scaffold & Build APK
        run: |
          # 1. إزالة أي مجلد أندرويد قديم لتفادي أي بقايا أو تعارض
          rm -rf android

          # 2. إنشاء بيئة أندرويد نظيفة تماماً بمعايير v2 embedding
          flutter create --platforms=android --org com.academic --project-name academic_calendar .

          # 3. تثبيت المكتبات وتحديث التبعيات
          flutter pub get

          # 4. بناء نسخة Debug APK
          flutter build apk --debug

      - name: Upload Debug APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: Academic-Calendar-Debug-APK
          path: build/app/outputs/flutter-apk/app-debug.apk
